name: PocketDVDNet
options:
  bundleIdPrefix: com.tomd.pocketdvdnet
  deploymentTarget:
    iOS: "16.0"
targets:
  PocketDVDNet:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/PocketDVDNet.mlpackage
    settings:
      base:
        DEVELOPMENT_TEAM: 8P3BX64C4C
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    info:
      path: Info.plist
      properties:
        NSCameraUsageDescription: Frames from the camera are denoised on-device to demonstrate PocketDVDNet.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  PocketDVDNet:
    build:
      targets:
        PocketDVDNet: all
    run:
      config: Debug
