# Configuration for on-the-fly distillation with ShiftNet as teacher

# Basic training settings
batch_size: 32
patch_size: 160
test_batch_size: 1000
iterations: 100000
lr: 0.001 # Initial learning rate for distillation
noise_ival: [45, 55]  # Noise range for training
val_noiseL: 50       # Fixed noise level for validation
seed: 42

# Paths
trainset_dir: "/home/imogend/Documents/Extra bits/Pacnet/PaCNet-denoiser/train"  # Dataset path (MSE config)
valset_dir: "/home/imogend/Documents/Data/DAVIS 420p JPEG VAL"
out_dir: "/home/imogend/Documents/Data/out_onfly_distill"
teacher_checkpoint: "/home/imogend/Documents/GitHub/studfastdvdnet/Shift-Net/net_denoise.pth"
# Training configuration
num_workers: 4
num_prefetch_queue: 8
log_freq: 10
val_freq: 500

# Learning rate scheduler
scheduler:
  name: "StepLR"
  step_size: 20
  gamma: 0.6

# Distillation settings
distill_alpha: 0.5 # Weight for teacher loss (0.4 teacher, 0.6 gt)
loss_type: "charbonnier"  # or "l1"
sequence_length: 7  # or 5, depending on the model
