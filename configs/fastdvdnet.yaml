# configs/fastdvdnet.yaml

# Configuration for FastDVDNet
batch_size: 64    
patch_size: 96
test_batch_size: 1000  
epochs: 14    
lr: 0.001 
gamma: 0.1
noise_ival: [5, 55]
val_noiseL: 25.0

no_accel: false      
dry_run: false      

seed: 1        

out_dir: "./out_best"
valset_dir: "/home/wg19671/repos/fastdvdnet/val"
trainset_dir: "/home/wg19671/repos/fastdvdnet/data"
iterations: 30000
num_workers: 8
num_prefetch_queue: 8
log_freq: 10

scheduler:
  name: "StepLR"
  step_size: 80
  gamma: 0.1
