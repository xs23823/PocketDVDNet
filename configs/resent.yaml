# /home/wg19671/repos/Trainer/configs/resnet.yaml

data:
  train_dir: "/path/to/train"
  val_dir:   "/path/to/val"
  input_size: 224
  num_workers: 8
  batch_size: 64

model:
  name: "resnet50"
  pretrained: true
  num_classes: 1000

optimizer:
  type: "SGD"
  lr: 0.1
  momentum: 0.9
  weight_decay: 1e-4

scheduler:
  type: "StepLR"
  step_size: 30
  gamma: 0.1

augmentation:
  random_resized_crop: 
    size: 224
    scale: [0.08, 1.0]
    ratio: [3/4, 4/3]
  horizontal_flip: true
  color_jitter:
    brightness: 0.4
    contrast: 0.4
    saturation: 0.4
    hue: 0.1
  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

training:
  epochs: 90
  print_freq: 100
  checkpoint_dir: "./checkpoints"
  resume_from: ""      # path to .pth to resume, leave empty to start fresh

evaluation:
  eval_freq: 1         # run validation every N epochs

seed: 42