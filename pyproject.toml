[project]
name = "pocketdvdnet"
version = "0.1.0"
description = "Local runtime for the PocketDVDNet video denoiser"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.5",
    "pandas>=1.3",
    "pyyaml>=5.4",
    "scikit-image>=0.19",
    "scipy>=1.7",
    "tensorboardx>=2.5",
    "torch>=2.1",
    "torchaudio>=2.1",
    "torchvision>=0.16",
    "tqdm>=4.62",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
